appId: com.katoba.app
productName: KaTOBA
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
# ==== NHÉT BACKEND + MODELS VÀO APP ====
# Chép trọn backend/dist/main -> resources/backend trong app đã cài.
# Khớp đúng đường dẫn join(process.resourcesPath, 'backend', 'main.exe') trong index.js.
extraResources:
  - from: ../backend/dist/main
    to: backend
    filter:
      - '**/*'
win:
  executableName: KaTOBA
  # target 'dir' -> chỉ tạo thư mục portable win-unpacked, dùng Inno Setup đóng installer riêng
  # (tránh giới hạn mmap của NSIS khi app lớn — xem ghi chú bên dưới)
  target:
    - dir
  # Chưa có logo -> để trống, electron-builder tự dùng icon Electron mặc định.
  # Khi có file build/icon.ico, bỏ comment dòng dưới:
  # icon: build/icon.ico
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
